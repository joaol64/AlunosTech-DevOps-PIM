
name: Alunos Tech - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore AlunosTech.Tests/AlunosTech.Tests.csproj

      - name: Compilar projeto
        run: dotnet build AlunosTech.Tests/AlunosTech.Tests.csproj --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test AlunosTech.Tests/AlunosTech.Tests.csproj --configuration Release --no-build
      
      - name: Publicar aplicacao
        run: dotnet publish AlunosTech.Desktop/AlunosTech.Desktop.csproj --configuration Release --output ./publicacao

      - name: Armazenar artefato
        uses: actions/upload-artifact@v4
        with:
          name: AlunosTech-Desktop
          path: ./publicacao/
          if-no-files-found: error
      
    docker-test:
      runs-on: ubuntu-latest

      steps:
        - name: Baixar codigo
          uses: actions/checkout@v4

        - name: Construir imagem Docker
          run: docker build -t alunostech-api ./AlunosTech.Api

        - name: Iniciar container
          run: docker run -d --name alunostech-api -p 8080:8080 alunostech-api

        - name: Testar disponibilidade da API
          run: |
            for i in {1..15}; do
              if curl --fail --silent http://localhost:8080/health; then
                echo ""
                echo "API funcionando no container!"
                exit 0
              fi
              sleep 2
            done
            docker logs alunostech-api
            exit 1

        - name: Encerrar container
          if: always()
          run: docker rm -f alunostech-api || true

    
  kubernetes-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Validar estrutura YAML
        run: |
          python -c "import yaml; docs = list(yaml.safe_load_all(open('k8s/deployment.yaml', encoding='utf-8'))); assert len(docs) == 2; assert {d['kind'] for d in docs} == {'Deployment', 'Service'}; print('Manifestos YAML validos: Deployment e Service')"



