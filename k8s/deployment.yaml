
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alunostech-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alunostech-api
  template:
    metadata:
      labels:
        app: alunostech-api
    spec:
      containers:
        - name: alunostech-api
          image: alunostech-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: alunostech-api
spec:
  type: ClusterIP
  selector:
    app: alunostech-api
  ports:
    - port: 80
      targetPort: 8080
